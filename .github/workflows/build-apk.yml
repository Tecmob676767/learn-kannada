name: Build & Release Real Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync with Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Sobagu-Kannada.apk
          ls -la build-output/

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sobagu-Android-APK
          path: build-output/Sobagu-Kannada.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sobagu Kannada Native APK v1.0.${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
          body: |
            ### 🌸 Sobagu - Real Native Android APK Release
            - Native Android APK with offline Kannada learning
            - Interactive Varnamale, audio lessons, flashcards & quizzes
            - Free Forever (Plumine LTD)
            
            **Download APK directly below:**
          files: build-output/Sobagu-Kannada.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
