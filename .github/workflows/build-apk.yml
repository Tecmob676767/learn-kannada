name: Build & Release Real Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync with Capacitor Android & iOS
        run: |
          npx cap sync

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Release & Debug APKs
        run: |
          cd android
          ./gradlew assembleDebug
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/Sobagu-Kannada.apk \; || true
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/ || true

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sobagu-Android-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sobagu Kannada Native APK v1.0.${{ github.run_number }}"
          body: |
            ### 🌸 Sobagu - Real Native Android APK Release
            - Native Android APK with 0s Plumine CS+ Cloud Sync
            - Full Video & Voice Calling Support (WebRTC)
            - Kannada Pronunciation & Voice Recognition Drills
            - 100% Free Forever without Google Ads (Powered by Meta Audience Network)
            
            **Download APK directly below:**
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
